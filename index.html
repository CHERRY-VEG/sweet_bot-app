<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Наше приложение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#15121c; --card:#201b2b; --card2:#2a2438; --text:#f4efff; --hint:#9d93b5;
    --coral:#ff7a6b; --mint:#4fe0b5; --lav:#a99bff; --amber:#ffc46b; --sky:#6bc4ff;
    --accent:#ff7a6b;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:90px; }
  header { padding:16px 16px 4px; }
  h1 { margin:0; font-size:22px; }
  .sub { color:var(--hint); font-size:14px; margin-top:4px; }
  main { padding:8px 16px; }
  .empty { text-align:center; color:var(--hint); padding:28px 10px; }
  button { font-family:inherit; }

  /* Обычные списки */
  .add { background:var(--card); border-radius:16px; padding:12px; margin:12px 0; display:flex; flex-direction:column; gap:8px; }
  input[type=text], input[type=number], input[type=date], input[type=time], textarea { width:100%; font-family:inherit; min-width:0; padding:10px 12px; font-size:16px;
    border:1px solid #3a3350; border-radius:10px; background:var(--bg); color:var(--text); color-scheme:dark; }
  .primary { padding:11px 14px; font-size:16px; border:none; border-radius:12px; background:var(--accent); color:#1a1020; font-weight:600; cursor:pointer; }
  .item { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:14px; padding:12px; margin-bottom:8px; }
  .item input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); flex-shrink:0; }
  .item .body { flex:1; min-width:0; word-wrap:break-word; }
  .item.done .body { text-decoration:line-through; color:var(--hint); }
  .del { background:none; border:none; font-size:18px; color:var(--hint); cursor:pointer; padding:4px 8px; }
  .section-title { font-size:12px; color:var(--hint); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.05em; }

  /* Расписание */
  .weekbar { display:flex; align-items:center; justify-content:space-between; margin:6px 0 10px; }
  .weekbar .month { font-weight:600; text-transform:capitalize; }
  .navbtn { background:var(--card); color:var(--text); border:none; border-radius:10px; padding:8px 12px; font-size:15px; cursor:pointer; }
  .days { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .day { background:var(--card); border:2px solid transparent; border-radius:14px; padding:8px 0 6px; text-align:center; color:var(--text); cursor:pointer; }
  .day .wd { font-size:11px; color:var(--hint); }
  .day .num { font-size:17px; font-weight:600; margin:2px 0 4px; }
  .day.today .num { color:var(--coral); }
  .day.sel { border-color:var(--coral); background:var(--card2); }
  .dots { display:flex; justify-content:center; gap:3px; height:6px; }
  .dot { width:6px; height:6px; border-radius:50%; }
  .daytitle { font-size:17px; font-weight:600; margin:18px 0 8px; text-transform:capitalize; }
  .status { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border-radius:14px; padding:10px 12px; }
  .stat .lab { font-size:11px; color:var(--hint); text-transform:uppercase; letter-spacing:.04em; }
  .stat .val { font-size:14px; margin-top:4px; word-wrap:break-word; }
  .stat.miss .val { color:var(--hint); font-style:italic; }
  .card { display:flex; gap:10px; background:var(--card); border-radius:14px; padding:12px; margin-bottom:8px; border-left:5px solid var(--c); }
  .card .ic { font-size:20px; }
  .card .info { flex:1; min-width:0; }
  .card .t { font-weight:600; word-wrap:break-word; }
  .card .m { font-size:13px; color:var(--hint); margin-top:3px; word-wrap:break-word; }
  .chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--card2); color:var(--text); margin-left:6px; }
  .fab { position:fixed; right:16px; bottom:84px; width:56px; height:56px; border-radius:50%; border:none;
    background:var(--coral); color:#1a1020; font-size:30px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.45); z-index:5; }

  .seg { display:flex; background:var(--card); border-radius:14px; padding:4px; gap:4px; margin:4px 0 10px; }
  .seg button { flex:1; border:none; background:none; color:var(--hint); padding:9px 4px; border-radius:11px; font-size:15px; cursor:pointer; }
  .seg button.on { background:var(--card2); color:var(--text); font-weight:600; box-shadow:inset 0 0 0 2px var(--coral); }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cwd { text-align:center; font-size:11px; color:var(--hint); padding:2px 0; }
  .cell { background:var(--card); border:2px solid transparent; border-radius:9px; min-height:54px; padding:3px 2px; color:var(--text);
    text-align:center; cursor:pointer; display:flex; flex-direction:column; gap:2px; overflow:hidden; font-family:inherit; }
  .cell.blank { background:none; pointer-events:none; }
  .cell .cn { font-size:12px; font-weight:600; }
  .cell.today .cn { color:var(--coral); }
  .cell.sel { border-color:var(--coral); background:var(--card2); }
  .cell.hasstay { box-shadow:inset 0 -3px 0 var(--lav); }
  .pill { font-size:8px; line-height:11px; height:11px; border-radius:4px; color:#1a1020; font-weight:600; padding:0 2px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .more { font-size:9px; color:var(--hint); }

  textarea { resize:vertical; }
  .wish { background:var(--card); border-radius:16px; margin-bottom:10px; overflow:hidden; }
  .wish.done { opacity:.65; }
  .whead { display:flex; gap:12px; padding:12px; cursor:pointer; align-items:center; }
  .thumb { width:64px; height:64px; border-radius:12px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; flex-shrink:0; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .winfo { flex:1; min-width:0; }
  .winfo .t { font-weight:600; word-wrap:break-word; }
  .winfo .m { font-size:13px; color:var(--hint); margin-top:2px; }
  .price { color:var(--mint); font-weight:600; margin-top:3px; font-size:14px; }
  .wbody { padding:0 12px 14px; }
  .wdesc { font-size:14px; color:var(--hint); white-space:pre-wrap; word-wrap:break-word; }
  .offer { display:flex; align-items:center; gap:8px; background:var(--card2); border-radius:10px; padding:9px 10px; margin-bottom:6px; font-size:14px; }
  .offer.best { box-shadow:inset 0 0 0 2px var(--mint); }
  .offer .st { flex:1; min-width:0; word-wrap:break-word; }
  .offer .pr { font-weight:600; }
  .openbtn { background:var(--coral); color:#1a1020; border:none; border-radius:8px; padding:6px 10px; font-size:13px; font-weight:600; cursor:pointer; }
  .mini { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0; }
  .mini .full { grid-column:1/-1; }
  .photoprev { width:96px; height:96px; object-fit:cover; border-radius:12px; margin-top:8px; }

  .hintline { font-size:12px; color:var(--hint); margin-top:6px; }
  .gomap { width:100%; margin:10px 0 4px; }

  .three { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .rthumb { width:36px; height:52px; object-fit:cover; border-radius:6px; flex-shrink:0; }

  .res { display:flex; gap:10px; align-items:center; background:var(--card2); border-radius:10px; padding:8px; margin-bottom:6px; cursor:pointer; }
  .res img { width:40px; height:56px; object-fit:cover; border-radius:6px; background:var(--card); }
  .res .rt { font-size:12px; color:var(--mint); }

  .shopbtn { width:100%; margin-bottom:10px; }
  .item .m { font-size:12px; color:var(--hint); margin-top:2px; }

  .addrow { display:flex; gap:8px; margin-bottom:12px; }
  .addrow input { flex:1; }
  .thumb.s { width:44px; height:44px; font-size:20px; border-radius:10px; }
  .btns { flex-wrap:wrap; }
  .btns button { min-width:110px; }

  .citem { background:var(--card); border-radius:14px; margin-bottom:8px; overflow:hidden; }
  .citem.done { opacity:.7; }
  .citem.done .cname .t { text-decoration:line-through; color:var(--hint); }
  .crow { display:flex; align-items:center; gap:6px; padding:10px; }
  .cleft { flex:1; min-width:0; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .circ { width:22px; height:22px; border-radius:50%; border:2px solid var(--hint); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#1a1020; }
  .circ.on { background:var(--mint); border-color:var(--mint); }
  .cname { min-width:0; word-wrap:break-word; }
  .cname .m { font-size:12px; color:var(--hint); margin-top:2px; }
  .stepper { display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .sbtn { width:28px; height:28px; border:none; border-radius:8px; background:var(--card2); color:var(--text); font-size:18px; cursor:pointer; padding:0; }
  .qcol { display:flex; flex-direction:column; align-items:center; }
  input.qinp { width:44px; padding:2px; text-align:center; font-size:15px; height:24px; border-radius:6px; -moz-appearance:textfield; }
  input.qinp::-webkit-inner-spin-button, input.qinp::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .unit { font-size:10px; color:var(--hint); }
  .mbtn { background:none; border:none; color:var(--hint); font-size:13px; cursor:pointer; padding:4px 2px; }
  .cpanel { padding:0 12px 12px; }
  .cpanel select { width:100%; padding:10px 12px; font-size:16px; border:1px solid #3a3350; border-radius:10px; background:var(--bg); color:var(--text); }
  .cartsum { font-size:14px; color:var(--mint); font-weight:600; margin:4px 0 8px; }
  .cartbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; align-items:center; }
  .cartbar button { flex:1 1 30%; font-size:14px; padding:10px 6px; }
  button:disabled { opacity:.4; cursor:default; }

  .ver { position:fixed; left:8px; bottom:calc(env(safe-area-inset-bottom,0px) + 62px); font-size:10px; color:var(--hint); opacity:.7; pointer-events:none; z-index:6; }

  /* Форма добавления */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:flex; align-items:flex-end; }
  .sheet { background:var(--card); width:100%; max-height:90%; overflow-y:auto; border-radius:22px 22px 0 0; padding:16px 16px 28px; }
  .sheet h2 { margin:0 0 12px; font-size:18px; }
  .lab2 { font-size:12px; color:var(--hint); margin:12px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .pick { background:var(--bg); color:var(--text); border:2px solid transparent; border-radius:20px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .pick.on { border-color:var(--c, var(--coral)); background:var(--card2); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btns { display:flex; gap:8px; margin-top:16px; }
  .btns button { flex:1; }
  .ghost { background:var(--card2); color:var(--text); border:none; border-radius:12px; padding:11px; font-size:16px; cursor:pointer; }

  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:1px solid #332c45;
    padding-bottom:env(safe-area-inset-bottom,0px); z-index:10; }
  nav button { flex:1; background:none; border:none; padding:8px 2px; color:var(--hint); font-size:10px; cursor:pointer; }
  nav button .ico { display:block; font-size:22px; margin-bottom:2px; }
  nav button.active { color:var(--coral); font-weight:600; }
</style>
</head>
<body>
<header><h1 id="title"></h1><div class="sub" id="subtitle"></div></header>
<main id="content"></main>
<nav id="nav"></nav>
<div class="ver" id="ver"></div>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  // Номер версии: увеличивай при каждой правке, чтобы видеть, что обновление дошло до телефона
  var APP_VERSION = '1.1';
  document.getElementById('ver').textContent = 'Версия ' + APP_VERSION;
  try { tg.setHeaderColor('#15121c'); tg.setBackgroundColor('#15121c'); } catch (e) {}

  var TABS = [
    { id:'schedule', icon:'📅', short:'Расписание', title:'Наше расписание', hint:'Где мы и чем заняты — как в ADAMS, только для двоих', schedule:true },
    { id:'wishes', icon:'🎁', short:'Хотелки', title:'Хотелки', hint:'Ссылки, фото, цены и где купить выгоднее', placeholder:'Что хочется?' },
    { id:'watch', icon:'🎬', short:'Смотреть', title:'Что посмотреть', hint:'Фильмы и сериалы: постер, рейтинги, трейлер', placeholder:'Название фильма или сериала' },
    { id:'go', icon:'📍', short:'Сходить', title:'Куда сходить', hint:'Места на двоих: ссылка, адрес, фото, меню, оценка', placeholder:'Куда пойдём?' },
    { id:'eat', icon:'🍕', short:'Поесть', title:'Что поесть', hint:'Блюда, рецепты и список покупок', placeholder:'Что хочется съесть?' },
    { id:'buy', icon:'🛒', short:'Купить', title:'Что купить', hint:'Корзина, расходники и заказы' }
  ];

  // Типы записей расписания (по аналогии с ADAMS)
  var TYPES = {
    stay:    { icon:'🏠', name:'Ночёвка',   color:'#a99bff', fields:['place','range'] },
    regular: { icon:'🔁', name:'Регулярное', color:'#4fe0b5', fields:['title','place','days','time','range'] },
    slot:    { icon:'💞', name:'Наш час',    color:'#ff7a6b', fields:['place','date','start'] },
    event:   { icon:'🎉', name:'Событие',    color:'#ffc46b', fields:['title','place','date','time'] },
    away:    { icon:'✈️', name:'Поездка',    color:'#6bc4ff', fields:['title','place','range'] }
  };
  var WHO = ['Вместе', 'Он', 'Она'];
  var WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var KEY = 'couple-app-data-v1';
  var data = {}, current = 'schedule';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function monday(d) { return addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay()+6)%7)); }
  function plus60(t) { var p = t.split(':'); return pad((+p[0]+1)%24) + ':' + p[1]; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  var today = ds(new Date());
  var selected = today;
  var monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  // Подписи переключателя. Можно заменить на ваши имена, например '👨 Кирилл'.
  var PEOPLE = [ { who:'Он', label:'👨 Он' }, { who:'Она', label:'👩 Она' }, { who:'Вместе', label:'💑 Мы' } ];
  var person = 'Вместе';

  function load() {
    try { var r = localStorage.getItem(KEY); data = r ? JSON.parse(r) : {}; } catch (e) { data = {}; }
    TABS.forEach(function (t) { if (!Array.isArray(data[t.id])) data[t.id] = []; });
    data.wishes = data.wishes.map(function (x) {
      return x.who ? x : { id:x.id, who:'Вместе', title:x.title || x.text || 'Хотелка', desc:'', photo:'', offers:[], done:!!x.done };
    });
    data.go = data.go.map(function (x) {
      return x.who ? x : { id:x.id, who:'Вместе', title:x.title || x.text || 'Место', address:'', url:'', desc:'', menu:'', photo:'', status:x.done ? 'visited' : 'want', rating:0 };
    });
    data.watch = data.watch.map(function (x) {
      return x.who ? x : { id:x.id, who:'Вместе', title:x.title || x.text || 'Фильм', year:'', kind:'', genres:'', desc:'', poster:'', kp:0, imdb:0, trailer:'', kpId:0, status:x.done ? 'seen' : 'want', myRating:0 };
    });
    data.shop = Array.isArray(data.shop) ? data.shop : [];
    data.shop.forEach(function (x) { if (!(x.qty > 0)) x.qty = 1; if (!x.unit) x.unit = 'шт'; if (x.note === undefined) x.note = ''; if (x.url === undefined) x.url = ''; });
    data.supplies = Array.isArray(data.supplies) ? data.supplies : [];
    data.orders = Array.isArray(data.orders) ? data.orders : [];
    data.eat = data.eat.map(function (x) {
      return x.who ? x : { id:x.id, who:'Вместе', title:x.title || x.text || 'Блюдо', desc:'', photo:'', ingredients:[], recipe:'', cooked:0 };
    });
    // Перенос старых записей расписания в новый формат
    data.schedule = data.schedule.map(function (x) {
      if (x.type) return x;
      return { id:x.id, type:'event', who:'Вместе', title:x.text || 'Событие', place:'', date:x.date || today, start:x.time || '', end:'' };
    });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert('Не хватило памяти для сохранения. Попробуй фото поменьше.'); } }

  function occurs(e, d) {
    var wd = (parse(d).getDay()+6)%7;
    if (e.type === 'stay' || e.type === 'away') return e.date <= d && d <= (e.dateEnd || e.date);
    if (e.type === 'regular') return (e.days || []).indexOf(wd) > -1 && (!e.date || e.date <= d) && (!e.dateEnd || d <= e.dateEnd);
    return e.date === d;
  }
  function entriesFor(d) { return data.schedule.filter(function (e) { return e.who === person && occurs(e, d); }); }

  function renderNav() {
    var nav = document.getElementById('nav'); nav.innerHTML = '';
    TABS.forEach(function (t) {
      var b = el('button', t.id === current ? 'active' : '');
      b.appendChild(el('span', 'ico', t.icon)); b.appendChild(document.createTextNode(t.short));
      b.onclick = function () { current = t.id; render(); window.scrollTo(0, 0); };
      nav.appendChild(b);
    });
  }

  /* ---------- Обычные списки ---------- */
  function renderList(tab, main) {
    var form = el('div', 'add');
    var inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = tab.placeholder;
    var btn = el('button', 'primary', 'Добавить');
    function add() {
      var v = inp.value.trim(); if (!v) return;
      data[tab.id].push({ id:Date.now(), text:v, done:false }); save(); render();
    }
    btn.onclick = add; inp.onkeydown = function (e) { if (e.key === 'Enter') add(); };
    form.appendChild(inp); form.appendChild(btn); main.appendChild(form);

    var list = data[tab.id];
    if (!list.length) { main.appendChild(el('div', 'empty', 'Пока пусто. Добавьте первое ✨')); return; }
    function row(item) {
      var r = el('div', 'item' + (item.done ? ' done' : ''));
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!item.done;
      cb.onchange = function () { item.done = cb.checked; save(); render(); };
      var del = el('button', 'del', '✕');
      del.onclick = function () { if (confirm('Удалить?')) { data[tab.id] = list.filter(function (x) { return x.id !== item.id; }); save(); render(); } };
      r.appendChild(cb); r.appendChild(el('div', 'body', item.text)); r.appendChild(del);
      return r;
    }
    list.filter(function (x) { return !x.done; }).forEach(function (i) { main.appendChild(row(i)); });
    var done = list.filter(function (x) { return x.done; });
    if (done.length) { main.appendChild(el('div', 'section-title', 'Готово (' + done.length + ')')); done.forEach(function (i) { main.appendChild(row(i)); }); }
  }

  /* ---------- Расписание ---------- */
  function renderSchedule(main) {
    // Переключатель: Он / Она / Мы
    var seg = el('div', 'seg');
    PEOPLE.forEach(function (p) {
      var b = el('button', person === p.who ? 'on' : '', p.label);
      b.onclick = function () { person = p.who; render(); };
      seg.appendChild(b);
    });
    main.appendChild(seg);

    // Месяц
    var y = monthStart.getFullYear(), m = monthStart.getMonth();
    var bar = el('div', 'weekbar');
    var prev = el('button', 'navbtn', '‹'); prev.onclick = function () { monthStart = new Date(y, m - 1, 1); render(); };
    var next = el('button', 'navbtn', '›'); next.onclick = function () { monthStart = new Date(y, m + 1, 1); render(); };
    var tb = el('button', 'navbtn', 'Сегодня');
    tb.onclick = function () { var n = new Date(); monthStart = new Date(n.getFullYear(), n.getMonth(), 1); selected = today; render(); };
    bar.appendChild(prev); bar.appendChild(el('div', 'month', monthStart.toLocaleDateString('ru-RU', { month:'long', year:'numeric' })));
    bar.appendChild(tb); bar.appendChild(next);
    main.appendChild(bar);

    function shortText(e) {
      if (e.type === 'slot') return '💞' + e.start;
      if (e.type === 'away') return '✈️' + e.title;
      return e.title;
    }

  // «Яйца — 4 шт» -> { text:'Яйца', qty:4, unit:'шт' }
  function parseIngredient(str) {
    var t = String(str).trim(), m = t.match(/^(.+?)\s+[—–-]\s+(\d+(?:[.,]\d+)?)\s*([^\d\s,.].*)?$/);
    if (!m) return { text:t, qty:1, unit:'шт' };
    var u = (m[3] || '').trim().toLowerCase();
    var map = { 'шт':'шт', 'шт.':'шт', 'штук':'шт', 'штуки':'шт', 'штука':'шт', 'г':'г', 'гр':'г', 'гр.':'г', 'грамм':'г', 'кг':'кг', 'л':'л', 'литр':'л', 'литра':'л', 'уп':'уп', 'уп.':'уп', 'упак.':'уп', 'упаковка':'уп' };
    return { text:m[1].trim(), qty:parseFloat(m[2].replace(',', '.')) || 1, unit:map[u] || u || 'шт' };
  }
  function addToCart(text, dish, qty, unit) {
    qty = qty > 0 ? qty : 1; unit = unit || 'шт';
    var ex = data.shop.filter(function (x) { return !x.done && x.text.toLowerCase() === text.toLowerCase() && (x.unit || 'шт') === unit; })[0];
    if (ex) ex.qty = Math.round(((ex.qty || 1) + qty) * 100) / 100;
    else data.shop.push({ id:Date.now() + Math.random(), text:text, dish:dish || '', qty:qty, unit:unit, note:'', url:'', done:false });
  }
  function cartBody() {
    return data.shop.filter(function (x) { return !x.done; })
      .map(function (it) { return '• ' + it.text + ': ' + fmtQty(it) + (it.note ? ' (' + it.note + ')' : ''); }).join('\n');
  }
  function shareCart() {
    var head = '🛒 Список покупок', body = cartBody();
    try { tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(head) + '&text=' + encodeURIComponent(body)); }
    catch (e) { copyText(head + '\n' + body); }
  }

  function renderCart(main) {
    data.shop.forEach(function (x) { if (!(x.qty > 0)) x.qty = 1; if (!x.unit) x.unit = 'шт'; });
    main.appendChild(addRow('Добавить в корзину: молоко, хлеб…', function (v) { addToCart(v, ''); save(); render(); }));
    if (!data.shop.length) {
      main.appendChild(el('div', 'empty', 'Список пуст'));
      main.appendChild(el('div', 'hintline', 'Добавь позицию выше. Ингредиенты блюда попадут сюда сами: «Поесть» → блюдо → «Хотим приготовить».'));
      return;
    }
    var open = data.shop.filter(function (x) { return !x.done; }), done = data.shop.filter(function (x) { return x.done; });
    main.appendChild(el('div', 'cartsum', 'Осталось купить: ' + open.length + ' из ' + data.shop.length));

    var bar = el('div', 'cartbar');
    if (open.length) {
      var sd = el('button', 'primary', '📨 Отправить'); sd.onclick = shareCart;
      var cp = el('button', 'ghost', '📋 Скопировать'); cp.onclick = function () { copyText('🛒 Список покупок\n' + cartBody()); };
      bar.appendChild(sd); bar.appendChild(cp);
    } else bar.appendChild(el('div', 'hintline', 'Список пуст'));
    var clr = el('button', 'ghost', '🧹 Убрать купленное'); clr.disabled = !done.length;
    clr.onclick = function () { if (confirm('Убрать купленное (' + done.length + ')?')) { data.shop = data.shop.filter(function (x) { return !x.done; }); save(); render(); } };
    bar.appendChild(clr); main.appendChild(bar);

    function row(it) {
      var wrap = el('div', 'citem' + (it.done ? ' done' : '')), r = el('div', 'crow'), left = el('div', 'cleft');
      left.appendChild(el('span', 'circ' + (it.done ? ' on' : ''), it.done ? '✓' : ''));
      var nb = el('div', 'cname'); nb.appendChild(el('div', 't', it.text)); if (it.note) nb.appendChild(el('div', 'm', it.note));
      left.appendChild(nb);
      left.onclick = function () { it.done = !it.done; save(); render(); };

      var st = el('div', 'stepper'), minus = el('button', 'sbtn', '−'), plus = el('button', 'sbtn', '+'), col = el('div', 'qcol');
      var q = document.createElement('input'); q.type = 'number'; q.className = 'qinp'; q.value = it.qty; q.min = 1; q.step = 'any'; q.setAttribute('inputmode', 'decimal');
      minus.onclick = function () { if (it.qty > 1) { it.qty = Math.max(1, Math.round((it.qty - 1) * 100) / 100); save(); render(); } };
      plus.onclick = function () { it.qty = Math.round((it.qty + 1) * 100) / 100; save(); render(); };
      q.onchange = function () { var v = parseFloat(String(q.value).replace(',', '.')); it.qty = v >= 1 ? v : 1; save(); render(); };
      col.appendChild(q); col.appendChild(el('div', 'unit', it.unit));
      st.appendChild(minus); st.appendChild(col); st.appendChild(plus);

      var more = el('button', 'mbtn', (it.note ? '📝' : '') + (it.url ? '🔗' : '') + (openCartItem === it.id ? '▴' : '▾'));
      more.onclick = function () { openCartItem = openCartItem === it.id ? null : it.id; render(); };
      var del = el('button', 'del', '✕'); del.onclick = function () { data.shop = data.shop.filter(function (x) { return x !== it; }); save(); render(); };
      r.appendChild(left); r.appendChild(st); r.appendChild(more); r.appendChild(del); wrap.appendChild(r);

      if (openCartItem === it.id) {
        var pn = el('div', 'cpanel');
        function field(lab, node) { pn.appendChild(el('div', 'lab2', lab)); pn.appendChild(node); }
        var inote = document.createElement('input'); inote.type = 'text'; inote.value = it.note || ''; inote.placeholder = 'Добавь пояснение, например: цвет, марка, размер';
        inote.oninput = function () { it.note = inote.value; save(); };
        var iurl = document.createElement('input'); iurl.type = 'text'; iurl.value = it.url || ''; iurl.placeholder = 'Ссылка на товар (Ozon, WB…)';
        var sel = document.createElement('select');
        (UNITS.indexOf(it.unit) < 0 ? UNITS.concat([it.unit]) : UNITS).forEach(function (u) { var o = document.createElement('option'); o.value = u; o.textContent = u; if (u === it.unit) o.selected = true; sel.appendChild(o); });
        sel.onchange = function () { it.unit = sel.value; save(); render(); };
        var ob = el('button', 'openbtn', 'Открыть ссылку'); ob.style.marginTop = '10px'; ob.style.display = it.url ? 'inline-block' : 'none';
        ob.onclick = function () { openUrl(fixUrl(it.url)); };
        iurl.oninput = function () { it.url = iurl.value; save(); ob.style.display = it.url.trim() ? 'inline-block' : 'none'; };
        field('Пояснение', inote); field('Ссылка', iurl); field('Единица измерения', sel); pn.appendChild(ob);
        wrap.appendChild(pn);
      }
      return wrap;
    }
    var groups = {}, order = [];
    open.forEach(function (it) { var g = it.dish || 'Прочее'; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(it); });
    order.forEach(function (g) { main.appendChild(el('div', 'section-title', g)); groups[g].forEach(function (it) { main.appendChild(row(it)); }); });
    if (done.length) { main.appendChild(el('div', 'section-title', 'Куплено (' + done.length + ')')); done.forEach(function (it) { main.appendChild(row(it)); }); }
  }

  function renderSupplies(main) {
    main.appendChild(addRow('Новый расходник: бумага, крем…', function (v) {
      if (!data.supplies.some(function (x) { return x.text.toLowerCase() === v.toLowerCase(); })) data.supplies.push({ id:Date.now(), text:v });
      save(); render();
    }));
    main.appendChild(el('div', 'hintline', 'Расходники: то, что заканчивается снова и снова. Когда пора докупить, нажми «В корзину».'));
    var have = data.supplies.map(function (x) { return x.text.toLowerCase(); });
    var sug = SUGGEST.filter(function (t) { return have.indexOf(t.toLowerCase()) < 0; });
    if (sug.length) {
      main.appendChild(el('div', 'lab2', 'Быстро добавить'));
      var chips = el('div', 'chips');
      sug.forEach(function (t) {
        var b = el('button', 'pick', '+ ' + t);
        b.onclick = function () { data.supplies.push({ id:Date.now() + Math.random(), text:t }); save(); render(); };
        chips.appendChild(b);
      });
      main.appendChild(chips);
    }
    if (data.supplies.length) main.appendChild(el('div', 'section-title', 'Наши расходники'));
    data.supplies.forEach(function (it) {
      var r = el('div', 'item');
      var bd = el('div', 'body', it.text), ex = cartFind(it.text);
      if (ex) bd.appendChild(el('div', 'm', 'В корзине: ' + fmtQty(ex)));
      r.appendChild(bd);
      var b = el('button', 'openbtn', 'В корзину');
      b.onclick = function () { addToCart(it.text, 'Расходники', 1, 'шт'); save(); render(); };
      var del = el('button', 'del', '✕'); del.onclick = function () { data.supplies = data.supplies.filter(function (x) { return x !== it; }); save(); render(); };
      r.appendChild(b); r.appendChild(del); main.appendChild(r);
    });
  }

  function renderOrders(main) {
    var chips = el('div', 'chips'); chips.style.marginBottom = '12px';
    ['Все'].concat(STORE_CHIPS, ['Другое']).forEach(function (f) {
      var b = el('button', 'pick' + (orderFilter === f ? ' on' : ''), f);
      b.onclick = function () { orderFilter = f; render(); };
      chips.appendChild(b);
    });
    main.appendChild(chips);
    var list = data.orders.filter(function (o) {
      return orderFilter === 'Все' || o.store === orderFilter || (orderFilter === 'Другое' && STORE_CHIPS.indexOf(o.store) < 0);
    });
    if (!list.length) main.appendChild(el('div', 'empty', 'Пока пусто. Нажми + и вставь ссылку на товар из Ozon, Wildberries или Золотого яблока.'));
    list.sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); }).forEach(function (o) {
      var r = el('div', 'item' + (o.done ? ' done' : '')), cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!o.done;
      cb.onchange = function () { o.done = cb.checked; save(); render(); };
      var th = el('div', 'thumb s');
      if (o.photo) { var im = document.createElement('img'); im.src = o.photo; th.appendChild(im); } else th.textContent = '🛍';
      var b = el('div', 'body', o.title);
      b.appendChild(el('div', 'm', [o.store, o.price > 0 ? money(o.price) : '', o.note].filter(Boolean).join(' · ')));
      var ob = el('button', 'openbtn', 'Открыть'); ob.onclick = function () { openUrl(o.url); };
      var del = el('button', 'del', '✕'); del.onclick = function () { if (confirm('Удалить ссылку?')) { data.orders = data.orders.filter(function (x) { return x !== o; }); save(); render(); } };
      r.appendChild(cb); r.appendChild(th); r.appendChild(b); r.appendChild(ob); r.appendChild(del); main.appendChild(r);
    });
    var fab = el('button', 'fab', '+'); fab.onclick = openOrderForm; main.appendChild(fab);
  }

  function openOrderForm() {
    var f = { url:'', title:'', price:'', note:'', photo:'' };
    var S = makeSheet('Новая ссылка на товар'), kit = formKit(S.sh, f);
    var iUrl = kit.inp('text', 'url', 'Ozon, Wildberries, Золотое яблоко…'), status = el('div', 'hintline');
    kit.field('Ссылка на товар (можно вставить текст из «Поделиться»)', iUrl); S.sh.appendChild(status);
    var iTitle = kit.inp('text', 'title', 'Название товара'); kit.field('Название', iTitle);
    var iPrice = kit.inp('number', 'price', '0'); kit.field('Цена, ₽', iPrice);
    var tn = kit.area('note', 'Размер, цвет, зачем', 2); kit.field('Заметка', tn);
    kit.photo();
    linkAutofill(iUrl, status, function (d) {
      kit.set(iTitle, 'title', d.title); kit.set(iPrice, 'price', d.price);
      if (d.image) kit.showPhoto(d.image);
    });
    kit.buttons(S.ov, function () {
      var url = fixUrl(f.url);
      if (!url) { alert('Вставь ссылку на товар'); return; }
      var store = storeFromUrl(url);
      data.orders.push({ id:Date.now(), url:url, store:store, title:f.title.trim() || store, price:parseFloat(f.price) || 0, note:f.note.trim(), photo:f.photo, done:false });
      save(); S.ov.remove(); render();
    });
  }

  function render() {
    var tab = TABS.filter(function (t) { return t.id === current; })[0];
    document.getElementById('title').textContent = tab.icon + ' ' + tab.title;
    document.getElementById('subtitle').textContent = tab.hint;
    var main = document.getElementById('content'); main.innerHTML = '';
    renderNav();
    if (tab.schedule) renderSchedule(main); else if (tab.id === 'wishes') renderWishes(main); else if (tab.id === 'go') renderPlaces(main); else if (tab.id === 'watch') renderWatch(main); else if (tab.id === 'eat') renderEat(main); else if (tab.id === 'buy') renderBuy(main); else renderList(tab, main);
  }

  load(); render();
</script>
</body>
</html>
